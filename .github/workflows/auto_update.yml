name: Auto Update VPN Subscriptions

on:
  schedule:
    - cron: '0 * * * *'  # Запуск ровно в 00 минут каждого часа
  workflow_dispatch:     # Кнопка для ручного запуска в любое время

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write    # Даем роботу права на запись изменений

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Run update script
      run: python update_configs.py

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add subscription.txt
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update subscriptions" && git push)
